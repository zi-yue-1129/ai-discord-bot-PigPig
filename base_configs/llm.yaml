google_search_agent: gemini-3.1-flash-lite-preview
vllm_url: "http://127.0.0.1:8181"
llm_call_timeout: 180
# Most tokens one chat reply call may generate, reasoning included. A model stuck in a loop is
# stopped by the server at this size. 0 removes the cap.
max_output_tokens: 8192
reasoning_optimization_prompt: "\n\n[CRITICAL SYSTEM RULE]: Think efficiently and use minimal reasoning. Strict limit: keep any internal reasoning or <think> process extremely brief (under 3 sentences). Output final results and call tools immediately without extensive reflection."
# Optional AI tool groups: music, community, events, fun, games, playing. Each group is used in
# every channel unless limited here (the core tools are always there). Per group:
#   enabled: false        turns the group off everywhere
#   channels: [id, ...]   only in these channels (a thread follows its parent channel)
#   exclude_channels: [id, ...]  never in these channels
# Example:
#   tool_groups:
#     games:
#       channels: [123456789012345678]
tool_groups: {}
